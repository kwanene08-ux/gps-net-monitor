name: Analyze Dart Only

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'lib/**'
      - 'packages/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/workflows/analyze-only.yml'
      - 'android/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Create Android platform scaffolding if needed
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f android/settings.gradle ] && [ ! -f android/settings.gradle.kts ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/GPSNetManifest.xml
            cp android/app/src/main/res/xml/file_paths.xml /tmp/GPSNetFilePaths.xml
            cp android/app/src/main/kotlin/com/gpsnetmonitor/gps_net_monitor/MainActivity.kt /tmp/GPSNetMainActivity.kt
            flutter create --platforms=android --project-name gps_net_monitor --org com.gpsnetmonitor .
            cp /tmp/GPSNetManifest.xml android/app/src/main/AndroidManifest.xml
            mkdir -p android/app/src/main/res/xml
            cp /tmp/GPSNetFilePaths.xml android/app/src/main/res/xml/file_paths.xml
            mkdir -p android/app/src/main/kotlin/com/gpsnetmonitor/gps_net_monitor
            cp /tmp/GPSNetMainActivity.kt android/app/src/main/kotlin/com/gpsnetmonitor/gps_net_monitor/MainActivity.kt
          fi

      - name: Set isolated test application ID
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          from pathlib import Path
          import re
          import sys

          candidates = [
              Path("android/app/build.gradle"),
              Path("android/app/build.gradle.kts"),
          ]
          gradle = next((p for p in candidates if p.is_file()), None)
          if gradle is None:
              sys.exit("ERROR: ไม่พบ app Gradle file")

          data = gradle.read_text()
          expected_namespace = "com.gpsnetmonitor.gps_net_monitor"

          ns = re.findall(
              r'(?m)^\s*namespace\s*(?:=\s*)?"([^"]+)"',
              data
          )
          if ns != [expected_namespace]:
              sys.exit(f"ERROR: namespace ไม่ตรง: {ns}")

          pattern = re.compile(
              r'(?m)^(\s*applicationId\s*(?:=\s*)?)'
              r'"com\.gpsnetmonitor\.gps_net_monitor"(\s*)$'
          )
          matches = list(pattern.finditer(data))
          if len(matches) != 1:
              sys.exit(
                  f"ERROR: ต้องพบ applicationId เดิม 1 จุด "
                  f"แต่พบ {len(matches)}"
              )

          data = pattern.sub(
              r'\g<1>"com.gpsnetmonitor.gps_net_monitor.test"\g<2>',
              data,
              count=1
          )

          if "com.gpsnetmonitor.gps_net_monitor.test" not in data:
              sys.exit("ERROR: ตั้ง test applicationId ไม่สำเร็จ")

          gradle.write_text(data)
          print("PASS: namespace คงเดิม")
          print("PASS: applicationId แยกเป็น .test")
          print(f"Gradle: {gradle}")
          PYTHON

          if [ -f android/app/build.gradle ]; then
            grep -nE 'namespace|applicationId' android/app/build.gradle
          elif [ -f android/app/build.gradle.kts ]; then
            grep -nE 'namespace|applicationId' android/app/build.gradle.kts
          else
            echo "ERROR: ไม่พบ app Gradle file"
            exit 1
          fi

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart
        run: flutter analyze

      - name: Test Dart
        run: flutter test

      - name: Build debug ARM64 APK
        run: flutter build apk --debug --target-platform android-arm64

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: GPS-Net-Monitor-stationary-test-v1.5.2-ARM64
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
